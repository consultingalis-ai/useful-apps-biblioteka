# Release: na tag v* (npr. v0.1.0) gradi NSIS installer i kači ga na GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Beleška o izmenama iz CHANGELOG.md
        id: beleska
        shell: pwsh
        run: |
          $verzija = "${{ github.ref_name }}".TrimStart("v")
          $tekst = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $deo = [regex]::Match($tekst, "(?s)## \[$([regex]::Escape($verzija))\].*?(?=\n## \[|\z)").Value
          if (-not $deo) { $deo = "Pogledaj CHANGELOG.md" }
          $deo += "`n`nInstalacija: preuzmi .exe ispod. Ako Windows prikaže SmartScreen: More info → Run anyway."
          "beleska<<KRAJ" >> $env:GITHUB_OUTPUT
          $deo >> $env:GITHUB_OUTPUT
          "KRAJ" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Potpis za automatsko ažuriranje (bez ovoga release ne prolazi).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Biblioteka promptova ${{ github.ref_name }}
          releaseBody: ${{ steps.beleska.outputs.beleska }}
          releaseDraft: false
          prerelease: false
          # latest.json na Release-u: odavde aplikacija saznaje da postoji nova verzija.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
