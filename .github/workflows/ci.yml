# Provera na svaki PR: tipovi → lint → Vitest → cargo test → pun build sa installerom.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provera:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalacija paketa
        run: npm ci

      - name: Provera tipova
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Tauri build (NSIS installer)
        run: npx tauri build

      - name: Installer kao artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
