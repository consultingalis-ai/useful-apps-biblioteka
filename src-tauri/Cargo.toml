[package]
name = "biblioteka-promptova"
version = "0.1.0"
description = "Biblioteka promptova i nastavaka"
authors = ["Dušan"]
edition = "2024"

[lib]
# Sufiks `_lib` sprečava sukob imena lib i bin na Windows-u.
name = "biblioteka_promptova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.2"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
